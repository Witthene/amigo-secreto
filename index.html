<body>

  <svg class="d5" viewBox="0 0 100 100"><path d="M10 60 Q30 20 50 50 T90 40" stroke="#ffc72c" stroke-width="10" fill="none" stroke-linecap="round"/></svg>

</div><main class="convite">

<template id="tplPresente">
  <div class="palco" id="palco">
    <div class="raios"></div><div class="halo"></div><div class="sombra"></div>

        <defs>
          <linearGradient id="fEsq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8242b"/><stop offset="1" stop-color="#9e1219"/></linearGradient>
          <linearGradient id="fDir" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4d4f"/><stop offset="1" stop-color="#d1222a"/></linearGradient>
          <linearGradient id="fTopo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a80"/><stop offset=".5" stop-color="#ff5252"/><stop offset="1" stop-color="#e53935"/></linearGradient>
          <linearGradient id="fitaE" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5b400"/><stop offset="1" stop-color="#c98a00"/></linearGradient>
          <linearGradient id="fitaD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ffbf1f"/></linearGradient>
          <linearGradient id="fitaT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset="1" stop-color="#ffcc33"/></linearGradient>
          <radialGradient id="laco" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff6c4"/><stop offset=".5" stop-color="#ffcf2e"/><stop offset="1" stop-color="#d99a00"/></radialGradient>
          <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        </defs>
        <!-- dentro da caixa (aparece ao abrir) -->
        <polygon points="30,125 120,95 210,125 120,155" fill="#5e0a10"/>
        <polygon points="30,125 120,95 120,112 40,138" fill="#3d0509"/>
        <polygon points="120,95 210,125 200,138 120,112" fill="#4a070c"/>
        <ellipse cx="120" cy="130" rx="60" ry="16" fill="#ffe27a" opacity=".55" class="luzdentro"/>
        <!-- corpo -->        <polygon points="30,125 120,155 120,240 30,210" fill="url(#fEsq)"/>
        <polygon points="120,155 210,125 210,210 120,240" fill="url(#fDir)"/>
        <polygon points="68,137.7 82,142.3 82,227.3 68,222.7" fill="url(#fitaE)"/>
        <polygon points="158,142.3 172,137.7 172,222.7 158,227.3" fill="url(#fitaD)"/>
        <polygon points="120,155 210,125 210,140 120,170" fill="#000" opacity=".18"/>
        <polygon points="30,125 120,155 120,170 30,140" fill="#000" opacity=".25"/>
        <polygon points="186,133 196,129.7 196,205 186,208.3" fill="url(#brilho)"/>
        <!-- tampa -->
        <g id="tampa">
          <polygon points="20,110 120,142 120,162 20,130" fill="url(#fEsq)"/>

          <polygon points="163,128.2 177,123.8 77,91.8 63,96.2" fill="url(#fitaT)"/>

          <path d="M116 110 C104 122 96 132 92 146 L101 141 L104 151 C108 136 114 124 120 112Z" fill="#e0a800"/>

          <path d="M120 108 C144 66 186 76 166 100 C154 114 132 112 120 108Z" fill="url(#laco)"/>

      </svg>

</template>

<script>
/* brilhos dourados no fundo */
(()=>{const c=document.getElementById('brilhos'),x=c.getContext('2d');let f=[];
function r(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}r();addEventListener('resize',r);
for(let i=0;i<60;i++)f.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.4+.3,v:Math.random()*.18+.04,d:Math.random()*6});
(function a(){x.clearRect(0,0,innerWidth,innerHeight);for(const p of f){p.y-=p.v;p.d+=.015;if(p.y<-5){p.y=innerHeight+5;p.x=Math.random()*innerWidth}
const o=.18+Math.sin(p.d)*.16;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle='rgba(255,255,255,'+o+')';x.shadowColor='#fff';x.shadowBlur=6;x.fill()}requestAnimationFrame(a)})()})();

/* confete dourado */
window.confete=()=>{const k=document.createElement('canvas');k.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:5';k.width=innerWidth;k.height=innerHeight;document.body.appendChild(k);
const g=k.getContext('2d'),cs=['#f6e3b4','#d9b46c','#b38a45','#fff','#ff4a4f'];let p=[];
for(let i=0;i<180;i++)p.push({x:innerWidth/2,y:innerHeight*.42,vx:(Math.random()-.5)*16,vy:Math.random()*-15-3,s:Math.random()*7+3,a:Math.random()*6,w:Math.random()*.3+.1,c:cs[i%5]});
let t=0;(function d(){g.clearRect(0,0,k.width,k.height);for(const q of p){q.x+=q.vx;q.y+=q.vy;q.vy+=.32;q.vx*=.985;q.a+=q.w;g.save();g.translate(q.x,q.y);g.rotate(q.a);g.scale(1,Math.cos(q.a*2));g.fillStyle=q.c;g.fillRect(-q.s/2,-q.s/4,q.s,q.s/2);g.restore()}
if(++t<220)requestAnimationFrame(d);else k.remove()})()};
</script>

</html>
