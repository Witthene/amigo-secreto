<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amigo Secreto da Família Sousa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>
<body>
<div id="abertura" class="abertura">
  <video id="fundoVid" autoplay loop src="midia/abertura.mp4?v=1125140258" muted playsinline preload="auto" aria-hidden="true"></video>
  <video id="vid" src="midia/abertura.mp4?v=1125140258" playsinline preload="auto" poster="midia/capa.jpg"></video>
  <div class="capaIntro" id="capaIntro">
    <canvas id="poeiraIntro"></canvas>
    <p class="kicker">Família Sousa apresenta</p>
    <h1>Amigo<em>Secreto</em></h1>
    <i class="linhaOuro"></i>
    <p class="anoIntro">uma história que se repete todo fim de ano</p>
    <button class="play selo" id="play" aria-label="Começar">
      <svg viewBox="0 0 60 60">
        <defs>
          <radialGradient id="ceraP" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#fff1c8"/><stop offset=".3" stop-color="#e0c180"/><stop offset=".7" stop-color="#a5844b"/><stop offset="1" stop-color="#6e5428"/></radialGradient>
          <radialGradient id="ceraPIn" cx=".5" cy=".45" r=".55"><stop offset=".5" stop-color="#d1b071"/><stop offset="1" stop-color="#8a6c37"/></radialGradient>
        </defs>
        <path d="M30 2c5 0 7 3 11 4s8 1 10 5 0 7 2 11 4 6 3 10-4 6-5 10-1 8-5 10-7 0-11 2-6 4-10 3-6-3-10-5-8-1-10-5 0-7-2-11-4-6-3-10 4-6 5-10 1-8 5-10 7 0 11-2 5-4 9-2z" fill="url(#ceraP)"/>
        <circle cx="30" cy="30" r="18" fill="url(#ceraPIn)"/>
        <circle cx="30" cy="30" r="18" fill="none" stroke="#fff3d1" stroke-opacity=".5" stroke-width=".7"/>
        <circle cx="30" cy="30" r="15.5" fill="none" stroke="#6e5428" stroke-opacity=".55" stroke-width=".5" stroke-dasharray="1.2 1.6"/>
        <path d="M26 22.5v15l12-7.5z" fill="#5a4420"/><path d="M25.6 22v15l12-7.5z" fill="#fff3d1" opacity=".3"/>
        <ellipse cx="21" cy="14" rx="9" ry="4" fill="#fff" opacity=".35" transform="rotate(-25 21 14)"/>
      </svg>
    </button>
    <p class="dicaPlay">Toque no lacre para começar</p>
    <p class="somAviso">aumente o volume <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H2v6h4l5 4V5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></p>
  </div>
  <div class="barra"><i id="prog"></i></div>
  <button class="pular hide" id="pular">Pular ›</button>
</div>
<script>
document.body.classList.add('intro');
(()=>{const c=document.getElementById('poeiraIntro');if(!c)return;const x=c.getContext('2d');let f=[];const r=()=>{c.width=innerWidth;c.height=innerHeight};r();addEventListener('resize',r);for(let i=0;i<90;i++)f.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.7,y:Math.random()*innerHeight,r:Math.random()*1.5+.3,v:Math.random()*.15+.03,d:Math.random()*6});(function a(){if(!c.isConnected)return;x.clearRect(0,0,c.width,c.height);for(const p of f){p.y-=p.v;p.d+=.012;p.x+=Math.sin(p.d)*.2;if(p.y<-4){p.y=c.height+4}const o=(.25+Math.sin(p.d*3)*.2)*(1-Math.abs(p.x-c.width/2)/(c.width*.4));x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle='rgba(241,226,189,'+Math.max(0,o)+')';x.fill()}requestAnimationFrame(a)})()})();
(() => {
  const ab = document.getElementById('abertura'), v = document.getElementById('vid'), f = document.getElementById('fundoVid');
  const fim = () => {
    if (!document.body.classList.contains('intro')) return;
    v.pause(); f.pause(); ab.classList.add('sai');
    document.body.classList.remove('intro');
    window.som && som.musica();
    setTimeout(() => ab.remove(), 900);
  };
  document.getElementById('play').onclick = e => {
    e.stopPropagation();
    ab.classList.add('tocando');
    v.currentTime = 0; f.currentTime = 0; f.loop = false;
    v.play(); f.play();
    setTimeout(() => document.getElementById('pular').classList.remove('hide'), 2500);
  };
  document.getElementById('pular').onclick = e => { e.stopPropagation(); fim(); };
  v.onended = fim;
  v.ontimeupdate = () => { document.getElementById('prog').style.width = (v.currentTime / v.duration * 100) + '%'; f.currentTime - v.currentTime > .3 || v.currentTime - f.currentTime > .3 ? f.currentTime = v.currentTime : 0; };
})();
</script>
<canvas id="brilhos"></canvas>

<div class="grao" aria-hidden="true"></div><div class="cine-barra cima"></div><div class="cine-barra baixo"></div><p class="legenda" id="legenda"></p><div class="flash" id="flash"></div>
<main class="convite">
  <i class="canto a"></i><i class="canto b"></i><i class="canto c"></i><i class="canto d"></i>
  <div id="app"><p class="sub">Carregando...</p></div>
</main>

<template id="tplPresente"><div class="palco" id="palco">
  <div class="halo"></div><div class="chao"></div>
  <div class="env">
    <svg class="env-defs" width="0" height="0" aria-hidden="true"><defs>
      <filter id="papel" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="4" seed="3" result="n"/>
        <feDiffuseLighting in="n" surfaceScale="1.4" lighting-color="#ffffff" result="luz"><feDistantLight azimuth="235" elevation="55"/></feDiffuseLighting>
        <feComposite in="luz" in2="SourceGraphic" operator="in" result="luzc"/>
        <feBlend in="SourceGraphic" in2="luzc" mode="multiply" result="b"/>
        <feComposite in="b" in2="SourceGraphic" operator="in"/>
      </filter>
      <filter id="sombraAba" x="-10%" y="-10%" width="120%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
      <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8e7140"/><stop offset=".25" stop-color="#f6e6bd"/><stop offset=".45" stop-color="#c9a96e"/>
        <stop offset=".7" stop-color="#fff3d1"/><stop offset="1" stop-color="#8e7140"/>
      </linearGradient>
      <linearGradient id="gF" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2a31"/><stop offset=".55" stop-color="#18181d"/><stop offset="1" stop-color="#0d0d10"/></linearGradient>
      <linearGradient id="gL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#202026"/><stop offset="1" stop-color="#16161a"/></linearGradient>
      <linearGradient id="gR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#121215"/><stop offset="1" stop-color="#1c1c21"/></linearGradient>
      <linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34343c"/><stop offset=".6" stop-color="#23232a"/><stop offset="1" stop-color="#1b1b20"/></linearGradient>
      <radialGradient id="cera" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#fff1c8"/><stop offset=".3" stop-color="#e0c180"/><stop offset=".7" stop-color="#a5844b"/><stop offset="1" stop-color="#6e5428"/></radialGradient>
      <radialGradient id="ceraIn" cx=".5" cy=".5" r=".5"><stop offset=".6" stop-color="#c7a666"/><stop offset="1" stop-color="#8a6c37"/></radialGradient>
    </defs></svg>
    <div class="env-fundo"><svg viewBox="0 0 300 196" preserveAspectRatio="none"><rect width="300" height="196" rx="6" fill="#0c0c0f" filter="url(#papel)"/></svg></div>
    <div class="env-cartao"><small>Você tirou</small><div class="nome" id="nm"></div><i class="filete"></i></div>
    <div class="env-frente"><svg viewBox="0 0 300 196" preserveAspectRatio="none">
      <!-- abas laterais -->
      <path d="M0 0 L132 104 Q150 116 132 124 L0 196Z" fill="url(#gL)" filter="url(#papel)"/>
      <path d="M300 0 L168 104 Q150 116 168 124 L300 196Z" fill="url(#gR)" filter="url(#papel)"/>
      <!-- sombra da aba de baixo sobre as laterais -->
      <path d="M0 196 L150 100 L300 196Z" fill="#000" opacity=".55" filter="url(#sombraAba)" transform="translate(0,-4)"/>
      <!-- aba de baixo -->
      <path d="M0 196 L140 104 Q150 98 160 104 L300 196Z" fill="url(#gF)" filter="url(#papel)"/>
      <path d="M2 195 L140 104 Q150 98 160 104 L298 195" fill="none" stroke="url(#ouro)" stroke-width="1.1" opacity=".85"/>
      <path d="M1 1 L132 104" stroke="url(#ouro)" stroke-width=".7" opacity=".45"/><path d="M299 1 L168 104" stroke="url(#ouro)" stroke-width=".7" opacity=".45"/>
      <!-- borda em ouro com filete duplo -->
      <rect x=".75" y=".75" width="298.5" height="194.5" rx="6" fill="none" stroke="url(#ouro)" stroke-width="1.5"/>
      <rect x="6" y="6" width="288" height="184" rx="3" fill="none" stroke="url(#ouro)" stroke-width=".5" opacity=".35"/>
    </svg></div>
    <div class="env-aba"><svg viewBox="0 0 300 124" preserveAspectRatio="none">
      <path d="M4 2 L150 124 L296 2Z" fill="#000" opacity=".6" filter="url(#sombraAba)" transform="translate(0,6)"/>
      <path d="M0 0 L300 0 L162 112 Q150 122 138 112Z" fill="url(#gA)" filter="url(#papel)"/>
      <path d="M1 1 L138 112 Q150 122 162 112 L299 1" fill="none" stroke="url(#ouro)" stroke-width="1.3"/>
      <path d="M0 .5 L300 .5" stroke="#fff" stroke-opacity=".12"/>
    </svg></div>
    <div class="lacre"><svg viewBox="0 0 60 60">
      <path d="M30 2c5 0 7 3 11 4s8 1 10 5 0 7 2 11 4 6 3 10-4 6-5 10-1 8-5 10-7 0-11 2-6 4-10 3-6-3-10-5-8-1-10-5 0-7-2-11-4-6-3-10 4-6 5-10 1-8 5-10 7 0 11-2 5-4 9-2z" fill="url(#cera)"/>
      <circle cx="30" cy="30" r="17" fill="url(#ceraIn)"/>
      <circle cx="30" cy="30" r="17" fill="none" stroke="#fff3d1" stroke-opacity=".55" stroke-width=".8"/>
      <circle cx="30" cy="30" r="14.5" fill="none" stroke="#6e5428" stroke-opacity=".6" stroke-width=".6" stroke-dasharray="1.2 1.6"/>
      <text x="30" y="37.5" text-anchor="middle" font-family="Cormorant Garamond,serif" font-style="italic" font-weight="600" font-size="22" fill="#5a4420">S</text>
      <text x="29.4" y="36.8" text-anchor="middle" font-family="Cormorant Garamond,serif" font-style="italic" font-weight="600" font-size="22" fill="#fff3d1" opacity=".35">S</text>
      <ellipse cx="22" cy="15" rx="9" ry="4" fill="#fff" opacity=".35" transform="rotate(-25 22 15)"/>
    </svg></div>
  </div>
</div></template>

<script>
/* brilhos dourados no fundo */
/* poeira dourada dançando no facho de luz */
(()=>{const c=document.getElementById('brilhos'),x=c.getContext('2d');let f=[],W,H;
function r(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}r();addEventListener('resize',r);
const novo=(y)=>{const largura=Math.min(520,W*.85);return{x:W/2+(Math.random()-.5)*largura*(0.4+Math.random()*.6),y:y??Math.random()*H,r:Math.random()*1.6+.3,v:Math.random()*.12+.02,d:Math.random()*6,s:Math.random()*.6+.2}};
for(let i=0;i<110;i++)f.push(novo());
(function a(){x.clearRect(0,0,W,H);for(const p of f){p.y-=p.v;p.d+=.01;p.x+=Math.sin(p.d)*.15;if(p.y<-5)Object.assign(p,novo(H+5));
const luz=Math.max(0,1-Math.abs(p.x-W/2)/(Math.min(520,W*.85)/2))*(1-p.y/H*.6);const o=(.15+Math.sin(p.d*3)*.12+.15)*luz*p.s*2;
x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle='rgba(241,226,189,'+o+')';x.shadowColor='#d6ba82';x.shadowBlur=8;x.fill()}requestAnimationFrame(a)})()})();
/* faíscas do lacre */
window.faiscas=(cx,cy)=>{const k=document.createElement('canvas');k.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:16';k.width=innerWidth;k.height=innerHeight;document.body.appendChild(k);
const g=k.getContext('2d');let p=[];for(let i=0;i<140;i++){const a=Math.random()*7,v=Math.random()*9+2;p.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,l:1,r:Math.random()*2+.6})}
(function d(){g.clearRect(0,0,k.width,k.height);let vivo=0;for(const q of p){if(q.l<=0)continue;vivo++;q.x+=q.vx;q.y+=q.vy;q.vx*=.95;q.vy=q.vy*.95+.12;q.l-=.014;
g.globalAlpha=q.l;g.fillStyle=q.l>.6?'#fff7e0':'#d6ba82';g.shadowColor='#f1e2bd';g.shadowBlur=10;g.beginPath();g.arc(q.x,q.y,q.r,0,7);g.fill()}
if(vivo)requestAnimationFrame(d);else k.remove()})()};
/* envelope acompanha o movimento do mouse / celular */
(()=>{let rx=0,ry=0,tx=0,ty=0;const set=(a,b)=>{tx=a;ty=b};
addEventListener('mousemove',e=>set((e.clientY/innerHeight-.5)*-10,(e.clientX/innerWidth-.5)*14));
addEventListener('deviceorientation',e=>{if(e.beta!=null)set(Math.max(-10,Math.min(10,(e.beta-45)*-.3)),Math.max(-14,Math.min(14,e.gamma*.4)))});
(function a(){rx+=(tx-rx)*.06;ry+=(ty-ry)*.06;document.documentElement.style.setProperty('--rx',rx.toFixed(2)+'deg');document.documentElement.style.setProperty('--ry',ry.toFixed(2)+'deg');requestAnimationFrame(a)})()})();window.confete=()=>{const k=document.createElement('canvas');k.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:5';k.width=innerWidth;k.height=innerHeight;document.body.appendChild(k);
const g=k.getContext('2d'),cs=['#f6e3b4','#d9b46c','#b38a45','#fff','#ff4a4f'];let p=[];
for(let i=0;i<90;i++)p.push({x:innerWidth/2,y:innerHeight*.3,vx:(Math.random()-.5)*16,vy:Math.random()*-15-3,s:Math.random()*7+3,a:Math.random()*6,w:Math.random()*.3+.1,c:cs[i%5]});
let t=0;(function d(){g.clearRect(0,0,k.width,k.height);for(const q of p){q.x+=q.vx;q.y+=q.vy;q.vy+=.32;q.vx*=.985;q.a+=q.w;g.save();g.translate(q.x,q.y);g.rotate(q.a);g.scale(1,Math.cos(q.a*2));g.fillStyle=q.c;g.fillRect(-q.s/2,-q.s/4,q.s,q.s/2);g.restore()}
if(++t<220)requestAnimationFrame(d);else k.remove()})()};
</script>
